name: CI

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # The "Failed to create bin at .../dist/cli.mjs" warnings on this
        # step are expected on a cold checkout — pnpm tries to symlink
        # the workspace bins before any package has been built. The next
        # step (Build) creates those files; the bins get recreated on
        # the next install. The warnings don't affect anything downstream.
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # Must run BEFORE Check. Each `@alambic/*` package publishes its
        # public API via `dist/*.d.mts` (per its `exports` map), so the
        # typechecker can't resolve `@alambic/adapters`, `@alambic/manifest`,
        # etc. until their dist/ folders exist.
        #
        # We exclude `@examples/*` from this first pass: the example's
        # `build` script is `alambic build`, which needs the `alambic`
        # bin symlinked into `node_modules/.bin/`. pnpm only wires bin
        # symlinks at install time, and at install time `packages/cli/
        # dist/cli.mjs` doesn't exist yet — hence the warnings on the
        # Install step. The next step re-runs install (cheap, no fetches)
        # so the symlinks land, then we build the example end-to-end.
        #
        # `pnpm -r` runs scripts in topological dependency order, so
        # @alambic/adapters builds before @alambic/core, etc. Each
        # package's `build` script is `vp pack`.
        run: pnpm -r --filter '!@examples/*' run build

      - name: Rehydrate bin symlinks
        # Now that every workspace bin's `dist/*.mjs` exists, re-install
        # so pnpm can wire `node_modules/.bin/alambic` (and friends)
        # into each consumer's bin dir. Fast — no new packages to fetch.
        run: pnpm install --frozen-lockfile

      - name: Build example theme (end-to-end smoke)
        # Runs `alambic build` against the reference example. Catches
        # regressions in the staging pipeline + plugin orchestration
        # that the unit tests can't see (Vite, schema inlining, islands
        # snippet emission, per-template manifest).
        working-directory: examples/tailwind-alpine-theme
        run: pnpm build

      - name: Check (fmt + lint + typecheck)
        run: pnpm exec vp check

      - name: Test
        run: pnpm exec vp run -r test

      - name: Install Shopify CLI
        # Doctor's `Shopify CLI: fail if missing` check needs the
        # binary on PATH. The runner image doesn't ship it.
        run: npm install -g @shopify/cli@latest

      - name: Doctor (versions smoke from workspace root)
        # Run at workspace root: no alambic.config.ts here, so only the
        # Versions check fires. That's enough to catch shopify-cli /
        # node / pnpm version regressions in CI. A richer doctor sweep
        # against the example theme would need `.env` files we don't
        # ship — keep that for local dogfooding.
        run: pnpm exec alambic doctor
